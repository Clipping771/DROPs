name: DROPs Autonomous PR Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  drops-agent:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'drops') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@drops '))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run DROPs headless agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          BRANCH="drops/issue-${ISSUE_NUMBER}"
          git config user.name "drops-bot"
          git config user.email "drops-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          PROMPT="${COMMENT_BODY:-${ISSUE_TITLE}\n\n${ISSUE_BODY}}"
          npx --yes drops-agent --project . --mode yolo --max-steps 120 --max-cost 2.5 --jsonl "$PROMPT" | tee drops-run.jsonl

      - name: Commit and open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            rm -f drops-run.jsonl
            git add -A
            git commit -m "fix: resolve #${ISSUE_NUMBER} via DROPs agent"
            git push -u origin "drops/issue-${ISSUE_NUMBER}"
            gh pr create \
              --title "DROPs: ${ISSUE_TITLE} (#${ISSUE_NUMBER})" \
              --body "Automated PR generated by DROPs headless agent for #${ISSUE_NUMBER}." \
              --base main
          else
            echo "No file changes produced by DROPs."
          fi
