<!doctype html><html><head><meta charset="utf-8"><title>Counter</title></head>
<body style="font-family:sans-serif;padding:24px">
<h1>Counter</h1>
<p data-testid="count">Count: 0</p>
<button id="add">Add</button>
<button data-testid="dead">Does nothing</button>
<script>let n = 0; document.getElementById('add').onclick = () => { document.querySelector('[data-testid=count]').textContent = 'Count: ' + (++n); };</script>
</body></html>
